<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Sistema de Vendas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f7f3f1] p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
    <h1 class="text-2xl font-extrabold text-center text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600">
      Sistema de Vendas
    </h1>
    <p class="text-center text-gray-500 mt-2">Acesso restrito</p>

    {% if error %}
      <div class="mt-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
        {{ error }}
      </div>
    {% endif %}

    <form class="mt-6 space-y-4" method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next or '/' }}"/>

      <div>
        <label class="block text-gray-700 font-medium mb-1" for="username">Usuário</label>
        <input id="username" name="username" type="text" autocomplete="username"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500"
               placeholder="ex: admin" required/>
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1" for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500"
               placeholder="********" required/>
      </div>

      <button type="submit"
              class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition-colors">
        Entrar
      </button>

      <a href="/logout" class="block text-center text-sm text-gray-400 mt-2 hover:text-gray-600">
        Limpar sessão
      </a>
    </form>
  </div>
</body>
</html>
