<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- QZ Tray (client-side) -->
    <!-- Dependências recomendadas pelo QZ: Promise + SHA -->
    <script src="https://cdn.jsdelivr.net/npm/rsvp@4/dist/rsvp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.11.0/build/sha256.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.5/qz-tray.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7f3f1; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="main-application" class="bg-white p-8 sm:p-10 rounded-2xl shadow-2xl w-full max-w-2xl space-y-8">

        <header id="main-header" class="text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600">
                Sistema de Atendimento
            </h1>
            <p class="text-gray-500 mt-2">Localize o cliente e selecione o serviço</p>

            <!-- Status do QZ -->
            <p id="qz-status" class="mt-3 text-xs text-gray-500"></p>
        </header>

        <div id="client-section" class="space-y-6 fade-in">
            <h2 class="text-2xl font-semibold text-gray-800 border-b pb-3">1. Encontre o Cliente</h2>
            <div>
                <label for="telefone" class="block text-gray-700 font-medium mb-1">Telefone</label>
                <div class="flex space-x-2">
                    <input type="tel" id="telefone" placeholder="912 345 678" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <button id="search-client-button" class="bg-purple-600 text-white py-2 px-6 rounded-lg font-semibold hover:bg-purple-700 transition-colors">Buscar</button>
                </div>
                <p id="client-info" class="text-gray-600 text-base font-semibold mt-3 h-6"></p>
            </div>
            <div id="client-details-input" class="hidden space-y-4">
                <div>
                    <label for="nome-cliente" class="block text-gray-700 font-medium mb-1">Nome do Cliente</label>
                    <input type="text" id="nome-cliente" placeholder="Digite o nome do cliente" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label for="nif-cliente" class="block text-gray-700 font-medium mb-1">NIF (Opcional)</label>
                    <input type="text" id="nif-cliente" placeholder="Ex: 999999999" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                 <button id="register-client-button" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">Cadastrar Novo Cliente</button>
            </div>
            <button id="continue-to-services-button" class="hidden mt-4 w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition-colors">Seguinte</button>
        </div>

        <div id="service-section" class="space-y-6 hidden">
            <div id="service-categories-container">
                <h2 class="text-2xl font-semibold text-gray-800 border-b pb-3 mb-6">2. Selecione a Categoria</h2>
                <div id="service-categories" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
            </div>
            <div id="specific-services-container" class="hidden">
                 <h2 id="specific-service-title" class="text-2xl font-semibold text-gray-800 border-b pb-3 mb-6">3. Selecione o Serviço</h2>
                 <div id="specific-services" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
                <button id="back-to-categories-button" class="mt-6 w-full bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition-colors">Voltar para Categorias</button>
            </div>
        </div>

        <div id="order-summary-section" class="space-y-6 hidden">
             <h2 class="text-2xl font-semibold text-gray-800 border-b pb-3">4. Resumo do Pedido</h2>
             <div class="bg-gray-50 p-4 rounded-lg">
                 <p class="font-medium text-gray-600">Cliente:</p>
                 <p id="summary-client-name" class="text-lg font-semibold text-purple-800"></p>
             </div>
             <div>
                <h3 class="font-semibold text-gray-700 mb-2">Serviços Selecionados:</h3>
                <div id="summary-services-list" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>
             </div>
             <div>
                <label for="order-comments" class="block text-gray-700 font-medium mb-1">Observações Gerais do Pedido</label>
                <textarea id="order-comments" rows="3" placeholder="Ex: Cliente pediu urgência, tecido delicado..." class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="delivery-date" class="block text-gray-700 font-medium mb-1">Data de Entrega Prevista</label>
                    <input type="date" id="delivery-date" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                 <div>
                    <label for="discount-input" class="block text-gray-700 font-medium mb-1">Desconto (€)</label>
                    <input type="number" id="discount-input" placeholder="0.00" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
            </div>
            <div class="space-y-3 pt-4 border-t">
                <div class="flex items-center">
                    <input id="nif-checkbox" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-purple-600 focus:ring-purple-500">
                    <label for="nif-checkbox" class="ml-3 block text-gray-900 font-medium">Adicionar Contribuinte para Fatura</label>
                </div>
                <div id="nif-details-container" class="hidden ml-7 space-y-2"></div>
            </div>
             <div class="text-right border-t pt-4">
                 <p class="text-2xl font-bold text-gray-800">Total: <span id="summary-total-price" class="text-purple-600">€ 0.00</span></p>
             </div>
             <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4">
                <button id="add-another-service-button" class="w-full bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition-colors">Adicionar Outro Serviço</button>
                <button id="finalize-order-button" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition-colors">Finalizar Pedido</button>
             </div>
        </div>
    </div>

    <div id="service-details-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
            <h3 id="modal-title" class="text-2xl font-semibold text-gray-800 text-center">Adicionar Detalhes</h3>
            <div>
                <label for="service-quantity" class="block text-gray-700 font-medium mb-1">Quantidade</label>
                <input type="number" id="service-quantity" value="1" min="1" class="w-full px-4 py-2 rounded-lg border border-gray-300">
            </div>
            <div>
                <label for="service-description" class="block text-gray-700 font-medium mb-1">Descrição Adicional</label>
                <textarea id="service-description" rows="3" placeholder="Detalhes específicos..." class="w-full px-4 py-2 rounded-lg border border-gray-300"></textarea>
            </div>
            <div class="flex justify-end space-x-4">
                <button id="modal-cancel-button" class="bg-gray-300 text-gray-700 py-2 px-6 rounded-full font-semibold">Cancelar</button>
                <button id="modal-confirm-button" class="bg-purple-600 text-white py-2 px-6 rounded-full font-semibold">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = `${window.location.protocol}//${window.location.host}`;

        // ---------------------------------------------------------------------
        // QZ Tray CONFIG
        // ---------------------------------------------------------------------
        // Ajuste aqui se o nome exato no Windows/Mac/Linux for diferente
        // (pode ser "POS-80", "POS 80", "POS80 Printer", etc.)
        const QZ_PRINTER_PREFERRED = "POS-80";

        const qzStatusEl = document.getElementById('qz-status');

        // QZ precisa saber qual Promise usar e qual SHA usar
        if (window.qz) {
            try {
                qz.api.setPromiseType(function(resolver) { return new RSVP.Promise(resolver); });
                qz.api.setSha256Type(function(data) { return sha256(data); });

                // Sem assinatura (vai mostrar prompts do QZ, dependendo da configuração)
                qz.security.setCertificatePromise(function(resolve, reject) { resolve(null); });
                qz.security.setSignaturePromise(function(toSign) { return function(resolve, reject) { resolve(null); }; });
            } catch (e) {
                console.warn("Falha configurando QZ API:", e);
            }
        }

        async function ensureQZConnected() {
            if (!window.qz) throw new Error("Biblioteca QZ não carregou (qz-tray.js).");
            if (qz.websocket && qz.websocket.isActive()) return true;

            qzStatusEl.textContent = "QZ: a conectar...";
            try {
                await qz.websocket.connect({ retries: 2, delay: 1 });
                qzStatusEl.textContent = "QZ: conectado ✅";
                return true;
            } catch (err) {
                qzStatusEl.textContent = "QZ: não conectado ❌ (abra o QZ Tray)";
                throw new Error("Não foi possível conectar ao QZ Tray. Verifique se o QZ Tray está instalado e aberto.");
            }
        }

        async function findBestPrinter() {
            await ensureQZConnected();

            // 1) tenta achar pelo nome preferido
            try {
                const found = await qz.printers.find(QZ_PRINTER_PREFERRED);
                if (found) return found;
            } catch (e) {
                // ignora e tenta outras estratégias
            }

            // 2) tenta variações comuns
            const variants = ["POS 80", "POS80", "POS-80", "TM-T20", "EPSON", "XP-80"];
            for (const v of variants) {
                try {
                    const found = await qz.printers.find(v);
                    if (found) return found;
                } catch (e) {}
            }

            // 3) fallback: impressora padrão do sistema
            try {
                const def = await qz.printers.getDefault();
                if (def) return def;
            } catch (e) {}

            // 4) sem printer
            throw new Error("Nenhuma impressora encontrada no QZ. Verifique o nome da impressora e se ela está instalada.");
        }

        function padRight(str, len) {
            str = String(str ?? "");
            if (str.length >= len) return str.slice(0, len);
            return str + " ".repeat(len - str.length);
        }

        function formatMoneyEUR(value) {
            const num = Number(value);
            if (!isFinite(num)) return "0.00";
            return num.toFixed(2);
        }

        function buildReceiptText(receipt) {
            // 80mm costuma caber 48 colunas (depende do font da impressora)
            const COLS = 48;
            const line = "-".repeat(COLS);

            const center = (text) => {
                text = String(text ?? "");
                if (text.length >= COLS) return text.slice(0, COLS);
                const left = Math.floor((COLS - text.length) / 2);
                const right = COLS - text.length - left;
                return " ".repeat(left) + text + " ".repeat(right);
            };

            const lines = [];

            // Cabeçalho (simples — depois ajustamos igual ao teu modelo)
            lines.push(center("FATURA"));
            lines.push(center("Sistema de Vendas"));
            lines.push(line);

            lines.push(`Pedido: #${receipt.pedido_id}`);
            lines.push(`Data:   ${receipt.currentDate}`);
            lines.push(`Entrega:${receipt.deliveryDate}`);
            lines.push(line);

            lines.push(`Cliente: ${receipt.clientName}`);
            if (receipt.clientNif) lines.push(`NIF:     ${receipt.clientNif}`);
            lines.push(line);

            // Itens
            lines.push(padRight("QTD  DESCRICAO", 34) + padRight("TOTAL", 14));
            lines.push(line);

            for (const it of (receipt.services || [])) {
                const qty = String(it.quantity ?? 1);
                const name = String(it.name ?? "").trim();
                const desc = String(it.description ?? "").trim();
                const itemTotal = formatMoneyEUR(it.itemTotal);

                // 1ª linha: qty + nome
                const left = `${qty}x ${name}`;
                lines.push(padRight(left, 34) + padRight(`€ ${itemTotal}`, 14));

                // 2ª linha opcional: descrição
                if (desc) {
                    const d = ("- " + desc);
                    // quebra básica em múltiplas linhas
                    let i = 0;
                    while (i < d.length) {
                        lines.push("  " + d.slice(i, i + (COLS - 2)));
                        i += (COLS - 2);
                    }
                }
            }

            lines.push(line);

            const discount = formatMoneyEUR(receipt.discount || 0);
            if (Number(discount) > 0) {
                lines.push(padRight("Desconto", 34) + padRight(`- € ${discount}`, 14));
            }
            lines.push(padRight("TOTAL", 34) + padRight(`€ ${formatMoneyEUR(receipt.totalPrice)}`, 14));

            lines.push(line);
            lines.push(center("Obrigado!"));
            lines.push(""); // linha em branco

            // Comandos ESC/POS (corte de papel)
            // init + feed + cut
            const escposInit = "\x1B\x40";
            const escposFeed = "\x1B\x64\x03"; // alimenta 3 linhas
            const escposCut  = "\x1D\x56\x00"; // corte total

            return escposInit + lines.join("\n") + "\n" + escposFeed + escposCut;
        }

        async function printViaQZ(receiptData) {
            const printer = await findBestPrinter();
            const config = qz.configs.create(printer, {
                copies: 1
            });

            const rawData = buildReceiptText(receiptData);

            // Envia como RAW/PLAIN (ESC/POS dentro do texto)
            const data = [{
                type: 'raw',
                format: 'plain',
                data: rawData
            }];

            qzStatusEl.textContent = `QZ: a imprimir em "${printer}"...`;
            await qz.print(config, data);
            qzStatusEl.textContent = `QZ: impresso ✅ (${printer})`;
        }

        // tenta conectar assim que a página abre (não quebra se falhar)
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await ensureQZConnected();
            } catch (e) {
                console.warn(e);
            }
        });

        // ---------------------------------------------------------------------
        // Seu código original
        // ---------------------------------------------------------------------
        const mainApplication = document.getElementById('main-application');
        const clientSection = document.getElementById('client-section');
        const serviceSection = document.getElementById('service-section');
        const orderSummarySection = document.getElementById('order-summary-section');
        const telefoneInput = document.getElementById('telefone');
        const searchClientButton = document.getElementById('search-client-button');
        const clientInfoParagraph = document.getElementById('client-info');
        const clientDetailsInputDiv = document.getElementById('client-details-input');
        const clientNameInput = document.getElementById('nome-cliente');
        const clientNifInput = document.getElementById('nif-cliente');
        const registerClientButton = document.getElementById('register-client-button');
        const continueToServicesButton = document.getElementById('continue-to-services-button');
        const serviceCategoriesContainer = document.getElementById('service-categories-container');
        const serviceCategoriesDiv = document.getElementById('service-categories');
        const specificServicesContainer = document.getElementById('specific-services-container');
        const specificServiceTitle = document.getElementById('specific-service-title');
        const specificServicesDiv = document.getElementById('specific-services');
        const backToCategoriesButton = document.getElementById('back-to-categories-button');
        const summaryClientName = document.getElementById('summary-client-name');
        const summaryServicesList = document.getElementById('summary-services-list');
        const summaryTotalPrice = document.getElementById('summary-total-price');
        const discountInput = document.getElementById('discount-input');
        const addAnotherServiceButton = document.getElementById('add-another-service-button');
        const finalizeOrderButton = document.getElementById('finalize-order-button');
        const serviceDetailsModal = document.getElementById('service-details-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalCancelButton = document.getElementById('modal-cancel-button');
        const modalConfirmButton = document.getElementById('modal-confirm-button');
        const nifCheckbox = document.getElementById('nif-checkbox');
        const nifDetailsContainer = document.getElementById('nif-details-container');

        let allServicesData = {};
        let currentClient = null;
        let selectedServices = [];
        let currentServiceAction = null;

        const handleClientSearch = async () => {
            const phone = telefoneInput.value.trim();
            clientDetailsInputDiv.classList.add('hidden');
            continueToServicesButton.classList.add('hidden');
            if (!phone) {
                clientInfoParagraph.textContent = 'Por favor, insira um número de telefone.';
                clientInfoParagraph.className = 'text-red-500 text-base font-semibold mt-3 h-6';
                return;
            }
            clientInfoParagraph.textContent = 'A buscar...';
            try {
                const response = await fetch(`${API_URL}/clients/${phone}`);
                if (response.status === 404) {
                    clientInfoParagraph.textContent = 'Cliente não encontrado. Por favor, preencha os dados para cadastro.';
                    clientInfoParagraph.className = 'text-blue-600 text-base font-semibold mt-3 h-6';
                    clientDetailsInputDiv.classList.remove('hidden');
                } else if (response.ok) {
                    currentClient = await response.json();
                    clientInfoParagraph.innerHTML = `Cliente encontrado: <strong class="text-purple-700">${currentClient.name}</strong>`;
                    clientInfoParagraph.className = 'text-green-600 text-base font-semibold mt-3 h-6';
                    continueToServicesButton.classList.remove('hidden');
                } else {
                    const errorData = await response.json().catch(() => ({ error: 'Erro desconhecido.' }));
                    throw new Error(errorData.error || 'Erro ao buscar cliente.');
                }
            } catch (error) {
                console.error(error);
                clientInfoParagraph.textContent = error.message;
                clientInfoParagraph.className = 'text-red-500 text-base font-semibold mt-3 h-6';
            }
        };

        const handleClientRegistration = async () => {
            const name = clientNameInput.value.trim();
            const phone = telefoneInput.value.trim();
            const nif = clientNifInput.value.trim();
            if (!name || !phone) { alert('Nome e telefone são obrigatórios.'); return; }
            try {
                const response = await fetch(`${API_URL}/clients`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, nif })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Erro ao cadastrar.');
                currentClient = { id: result.id, name: name, nif: nif };
                clientDetailsInputDiv.classList.add('hidden');
                clientInfoParagraph.innerHTML = `Cliente cadastrado: <strong class="text-purple-700">${name}</strong>`;
                clientInfoParagraph.className = 'text-green-600 text-base font-semibold mt-3 h-6';
                continueToServicesButton.classList.remove('hidden');
            } catch (error) {
                console.error(error);
                alert(`Erro: ${error.message}`);
            }
        };

        const loadServicesAndShowCategories = async () => {
            try {
                const response = await fetch(`${API_URL}/services`);
                if (!response.ok) throw new Error('Não foi possível carregar os serviços.');
                allServicesData = await response.json();
                displayServiceCategories(allServicesData);
                clientSection.classList.add('hidden');
                serviceSection.classList.remove('hidden');
            } catch (error) {
                console.error(error);
                alert(`Erro: ${error.message}`);
            }
        };

        function displayServiceCategories(categories) {
            serviceCategoriesDiv.innerHTML = '';
            Object.keys(categories).forEach(category => {
                const button = document.createElement('button');
                button.className = 'w-full text-center p-6 rounded-xl bg-purple-50 hover:bg-purple-200 border-2 border-purple-100 hover:border-purple-300 text-purple-800 font-bold transition-all duration-300 transform hover:scale-105';
                button.textContent = category;
                button.onclick = () => displaySpecificServices(category);
                serviceCategoriesDiv.appendChild(button);
            });
        }

        const displaySpecificServices = (category) => {
            specificServiceTitle.textContent = `3. Selecione o Serviço em ${category}`;
            specificServicesDiv.innerHTML = '';
            allServicesData[category].forEach(service => {
                const button = document.createElement('button');
                button.className = 'w-full text-left p-4 rounded-lg bg-gray-50 hover:bg-indigo-100 border transition-colors';
                button.innerHTML = `<span class="font-semibold text-gray-800">${service.nome}</span><span class="block text-sm text-gray-500">€ ${service.preco.toFixed(2)}</span>`;
                button.onclick = () => openServiceModal('add', service);
                specificServicesDiv.appendChild(button);
            });
            serviceCategoriesContainer.classList.add('hidden');
            specificServicesContainer.classList.remove('hidden');
        };

        const showCategories = () => {
            serviceCategoriesContainer.classList.remove('hidden');
            specificServicesContainer.classList.add('hidden');
        };

        const renderOrderSummary = () => {
            summaryClientName.textContent = currentClient.name;
            summaryServicesList.innerHTML = '';
            let total = 0;
            selectedServices.forEach((service, index) => {
                const itemTotal = service.preco * service.quantity;
                total += itemTotal;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex justify-between items-center bg-white p-3 rounded-lg border';
                itemDiv.innerHTML = `<div><p class="font-semibold">${service.quantity}x ${service.nome}</p><p class="text-sm text-gray-500">${service.description || 'Sem descrição'}</p></div><div class="flex items-center space-x-4"><span class="font-semibold text-gray-800">€ ${itemTotal.toFixed(2)}</span><button onclick="editService(${index})" class="text-blue-500 hover:text-blue-700 font-medium no-print">Editar</button><button onclick="removeService(${index})" class="text-red-500 hover:text-red-700 font-bold no-print">×</button></div>`;
                summaryServicesList.appendChild(itemDiv);
            });
            const discount = parseFloat(discountInput.value) || 0;
            summaryTotalPrice.textContent = `€ ${(total - discount).toFixed(2)}`;
            serviceSection.classList.add('hidden');
            orderSummarySection.classList.remove('hidden');
        };

        const updateNifDisplay = () => {
            nifDetailsContainer.innerHTML = '';
            if (nifCheckbox.checked) {
                if (currentClient && currentClient.nif) {
                     nifDetailsContainer.innerHTML = `<p class="font-medium text-gray-800 bg-gray-100 p-3 rounded-lg">Contribuinte: ${currentClient.nif}</p>`;
                } else {
                     nifDetailsContainer.innerHTML = `<label for="nif-input" class="block text-gray-700 font-medium mb-1">Nº Contribuinte</label><div class="flex space-x-2"><input type="text" id="nif-input" placeholder="999999999" class="w-full px-4 py-2 rounded-lg border border-gray-300"><button onclick="saveNif()" class="bg-indigo-600 text-white px-4 rounded-lg font-semibold hover:bg-indigo-700">Guardar</button></div><p id="nif-feedback" class="text-sm h-4 mt-1"></p>`;
                }
                nifDetailsContainer.classList.remove('hidden');
            } else {
                nifDetailsContainer.classList.add('hidden');
            }
        };

        const saveNif = async () => {
            const nifInput = document.getElementById('nif-input');
            const feedbackEl = document.getElementById('nif-feedback');
            const nif = nifInput.value.trim();
            if (!nif) { feedbackEl.textContent = 'Por favor, insira o NIF.'; feedbackEl.className = 'text-red-500 text-sm h-4 mt-1'; return; }
            try {
                const response = await fetch(`${API_URL}/clients/${currentClient.id}/nif`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nif: nif })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Erro ao guardar NIF.');
                currentClient.nif = nif;
                feedbackEl.textContent = 'NIF guardado com sucesso!';
                feedbackEl.className = 'text-green-600 text-sm h-4 mt-1';
                setTimeout(updateNifDisplay, 1500);
            } catch(error) {
                console.error(error);
                feedbackEl.textContent = error.message;
                feedbackEl.className = 'text-red-500 text-sm h-4 mt-1';
            }
        };

        const addServiceToOrder = (service, quantity, description) => {
            selectedServices.push({ ...service, quantity, description });
            renderOrderSummary();
        };

        const updateServiceInOrder = (index, quantity, description) => {
             selectedServices[index].quantity = quantity;
             selectedServices[index].description = description;
             renderOrderSummary();
        };

        const removeService = (index) => {
            selectedServices.splice(index, 1);
            if (selectedServices.length === 0) { showCategories(); orderSummarySection.classList.add('hidden'); }
            else { renderOrderSummary(); }
        };

        const editService = (index) => {
            openServiceModal('edit', selectedServices[index], index);
        };

        const openServiceModal = (action, service, index = null) => {
            currentServiceAction = { action, service, index };
            modalTitle.textContent = action === 'add' ? 'Adicionar Detalhes' : 'Editar Detalhes';
            document.getElementById('service-quantity').value = service.quantity || 1;
            document.getElementById('service-description').value = service.description || '';
            serviceDetailsModal.classList.remove('hidden');
        };

        const closeServiceModal = () => {
            serviceDetailsModal.classList.add('hidden');
            currentServiceAction = null;
        };

        const confirmServiceAction = () => {
            const quantity = parseInt(document.getElementById('service-quantity').value);
            const description = document.getElementById('service-description').value.trim();
            const { action, service, index } = currentServiceAction;
            if (action === 'add') { addServiceToOrder(service, quantity, description); }
            else if (action === 'edit') { updateServiceInOrder(index, quantity, description); }
            closeServiceModal();
        };

        const finalizeOrder = async () => {
            const deliveryDate = document.getElementById('delivery-date').value;
            const comments = document.getElementById('order-comments').value;
            const discount = parseFloat(document.getElementById('discount-input').value) || 0;
            if (!deliveryDate) { alert('Por favor, selecione uma data de entrega prevista.'); return; }

            let subtotal = 0;
            selectedServices.forEach(s => { subtotal += s.preco * s.quantity; });
            const totalPrice = subtotal - discount;

            const orderData = {
                clientId: currentClient.id,
                deliveryDate: deliveryDate,
                comments: comments,
                discount: discount,
                totalPrice: totalPrice,
                services: selectedServices.map(s => ({
                    id: s.id,
                    quantity: s.quantity,
                    description: s.description,
                    preco: s.preco,
                    nome: s.nome
                }))
            };

            try {
                const response = await fetch(`${API_URL}/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Não foi possível criar o pedido.');

                alert(`Pedido #${result.pedido_id} criado com sucesso! A imprimir...`);

                const receiptData = {
                    pedido_id: result.pedido_id,
                    clientName: currentClient.name,
                    clientNif: currentClient.nif,
                    currentDate: new Date().toLocaleString('pt-PT').replace(',', ''),
                    deliveryDate: new Date(orderData.deliveryDate + 'T00:00:00').toLocaleDateString('pt-PT'),
                    services: selectedServices.map(s => ({
                        quantity: s.quantity,
                        name: s.nome,
                        description: s.description,
                        itemTotal: (s.preco * s.quantity).toFixed(2)
                    })),
                    discount: orderData.discount.toFixed(2),
                    totalPrice: orderData.totalPrice.toFixed(2)
                };

                // ✅ NOVO: imprime via QZ (sem usar /print)
                await printViaQZ(receiptData);

                // se imprimiu OK, reseta página
                window.location.reload();

            } catch (error) {
                console.error(error);
                alert(
                    `Erro: ${error.message}\n\n` +
                    `• Confirme se o QZ Tray está aberto.\n` +
                    `• Confirme o nome da impressora (POS-80) e se ela está instalada.\n` +
                    `• Se precisar, me diga o nome EXATO da impressora no Windows.`
                );
            }
        };

        searchClientButton.addEventListener('click', handleClientSearch);
        telefoneInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleClientSearch(); });
        registerClientButton.addEventListener('click', handleClientRegistration);
        backToCategoriesButton.addEventListener('click', showCategories);
        discountInput.addEventListener('input', renderOrderSummary);
        modalCancelButton.addEventListener('click', closeServiceModal);
        modalConfirmButton.addEventListener('click', confirmServiceAction);
        addAnotherServiceButton.addEventListener('click', () => {
             orderSummarySection.classList.add('hidden');
             serviceSection.classList.remove('hidden');
             showCategories();
        });
        finalizeOrderButton.addEventListener('click', finalizeOrder);
        nifCheckbox.addEventListener('change', updateNifDisplay);
        continueToServicesButton.addEventListener('click', loadServicesAndShowCategories);

    </script>
</body>
</html>
