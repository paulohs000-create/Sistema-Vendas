<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto & Linha - Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f3f1;
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600">
                Painel de Gerenciamento
            </h1>
            <p class="text-gray-500 mt-2">Gerencie serviços e costureiras cadastrados no sistema.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">

            <!-- Menu lateral -->
            <div class="md:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-lg space-y-3">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Menu</h2>
                    <button id="nav-services" class="w-full text-left p-3 rounded-lg font-semibold bg-purple-100 text-purple-800 hover:bg-purple-200 transition-colors">
                        Gerir Serviços
                    </button>
                    <button id="nav-seamstresses" class="w-full text-left p-3 rounded-lg font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors">
                        Gerir Costureiras
                    </button>
                </div>
            </div>

            <!-- Conteúdo -->
            <div class="md:col-span-3 space-y-8">

                <!-- Gestão de Serviços -->
                <section id="services-management-section" class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Gestão de Serviços</h2>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <!-- Form -->
                        <div class="space-y-4">
                            <h3 id="form-title-service" class="text-lg font-bold text-gray-700">Adicionar Serviço</h3>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="service-name">Nome do Serviço</label>
                                <input id="service-name" type="text" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ex: Ajuste de barra" />
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="service-category-select">Categoria</label>
                                <select id="service-category-select" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500"></select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="service-price">Preço (€)</label>
                                <input id="service-price" type="number" step="0.01" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="15.00" />
                            </div>

                            <div class="flex gap-3">
                                <button id="cancel-edit-service-button" class="hidden w-full bg-gray-200 text-gray-800 py-2 rounded-lg font-semibold hover:bg-gray-300 transition-colors">
                                    Cancelar
                                </button>
                                <button id="action-service-button" class="w-full bg-purple-600 text-white py-2 rounded-lg font-semibold hover:bg-purple-700 transition-colors">
                                    Guardar
                                </button>
                            </div>
                        </div>

                        <!-- Lista -->
                        <div>
                            <h3 class="text-lg font-bold text-gray-700 mb-4">Serviços Cadastrados</h3>
                            <div id="services-list-container" class="space-y-3">
                                <p class="text-gray-500">A carregar...</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Gestão de Costureiras -->
                <section id="seamstress-management-section" class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg hidden">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Gestão de Costureiras</h2>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <!-- Form -->
                        <div class="space-y-4">
                            <h3 id="form-title-seamstress" class="text-lg font-bold text-gray-700">Adicionar Costureira</h3>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="seamstress-name">Nome da Costureira</label>
                                <input id="seamstress-name" type="text" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ex: Luziane" />
                            </div>

                            <div class="flex gap-3">
                                <button id="cancel-edit-seamstress-button" class="hidden w-full bg-gray-200 text-gray-800 py-2 rounded-lg font-semibold hover:bg-gray-300 transition-colors">
                                    Cancelar
                                </button>
                                <button id="action-seamstress-button" class="w-full bg-purple-600 text-white py-2 rounded-lg font-semibold hover:bg-purple-700 transition-colors">
                                    Adicionar Costureira
                                </button>
                            </div>
                        </div>

                        <!-- Lista -->
                        <div>
                            <h3 class="text-lg font-bold text-gray-700 mb-4">Costureiras Registadas</h3>
                            <div id="seamstress-list-container" class="space-y-3">
                                <p class="text-gray-500">A carregar...</p>
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <script>
        // ✅ IMPORTANTE: Railway / Produção / Local
        const API_URL = window.location.origin;

        // --- Referências Globais ---
        const navServicesBtn = document.getElementById('nav-services');
        const navSeamstressesBtn = document.getElementById('nav-seamstresses');
        const servicesSection = document.getElementById('services-management-section');
        const seamstressSection = document.getElementById('seamstress-management-section');

        // --- Referências de Serviços ---
        const servicesListContainer = document.getElementById('services-list-container');
        const formTitleService = document.getElementById('form-title-service');
        const serviceNameInput = document.getElementById('service-name');
        const serviceCategorySelect = document.getElementById('service-category-select');
        const servicePriceInput = document.getElementById('service-price');
        const actionServiceButton = document.getElementById('action-service-button');
        const cancelEditServiceButton = document.getElementById('cancel-edit-service-button');
        let editingServiceId = null;

        // --- Referências de Costureiras ---
        const seamstressListContainer = document.getElementById('seamstress-list-container');
        const formTitleSeamstress = document.getElementById('form-title-seamstress');
        const seamstressNameInput = document.getElementById('seamstress-name');
        const actionSeamstressButton = document.getElementById('action-seamstress-button');
        const cancelEditSeamstressButton = document.getElementById('cancel-edit-seamstress-button');
        let editingSeamstressId = null;

        // --- Navegação ---
        navServicesBtn.addEventListener('click', () => {
            servicesSection.classList.remove('hidden');
            seamstressSection.classList.add('hidden');
            navServicesBtn.classList.add('bg-purple-100', 'text-purple-800');
            navServicesBtn.classList.remove('bg-gray-100', 'text-gray-700');
            navSeamstressesBtn.classList.add('bg-gray-100', 'text-gray-700');
            navSeamstressesBtn.classList.remove('bg-purple-100', 'text-purple-800');
        });

        navSeamstressesBtn.addEventListener('click', () => {
            seamstressSection.classList.remove('hidden');
            servicesSection.classList.add('hidden');
            navSeamstressesBtn.classList.add('bg-purple-100', 'text-purple-800');
            navSeamstressesBtn.classList.remove('bg-gray-100', 'text-gray-700');
            navServicesBtn.classList.add('bg-gray-100', 'text-gray-700');
            navServicesBtn.classList.remove('bg-purple-100', 'text-purple-800');
        });

        // --- Funções Auxiliares ---
        function populateCategoryDropdown(categories) {
            const current = serviceCategorySelect.value;
            serviceCategorySelect.innerHTML = '';
            if (!categories || categories.length === 0) {
                const opt = document.createElement('option');
                opt.value = 'Geral';
                opt.textContent = 'Geral';
                serviceCategorySelect.appendChild(opt);
                return;
            }
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                serviceCategorySelect.appendChild(opt);
            });
            if (current && categories.includes(current)) serviceCategorySelect.value = current;
        }

        function resetServiceForm() {
            editingServiceId = null;
            formTitleService.textContent = 'Adicionar Serviço';
            actionServiceButton.textContent = 'Guardar';
            cancelEditServiceButton.classList.add('hidden');
            serviceNameInput.value = '';
            servicePriceInput.value = '';
        }

        function resetSeamstressForm() {
            editingSeamstressId = null;
            formTitleSeamstress.textContent = 'Adicionar Costureira';
            actionSeamstressButton.textContent = 'Adicionar Costureira';
            cancelEditSeamstressButton.classList.add('hidden');
            seamstressNameInput.value = '';
        }

        // --- Serviços ---
        async function loadAndRenderServices() {
            try {
                const response = await fetch(`${API_URL}/services`);
                if (!response.ok) throw new Error('Não foi possível carregar os serviços.');
                const servicesByCategory = await response.json();

                servicesListContainer.innerHTML = '';
                const categories = Object.keys(servicesByCategory || {});
                populateCategoryDropdown(categories);

                if (categories.length === 0) {
                    servicesListContainer.innerHTML = '<p class="text-gray-500">Ainda não há serviços cadastrados.</p>';
                    return;
                }

                for (const category in servicesByCategory) {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.innerHTML = `<h3 class="text-xl font-bold text-gray-700 border-b pb-2 mb-3">${category}</h3>`;
                    const list = document.createElement('div');
                    list.className = 'space-y-2';

                    servicesByCategory[category].forEach(s => {
                        const row = document.createElement('div');
                        row.className = 'flex items-center justify-between bg-gray-50 p-3 rounded-lg border';
                        row.innerHTML = `
                            <div>
                                <p class="font-semibold text-gray-800">${s.nome}</p>
                                <p class="text-sm text-gray-500">€ ${Number(s.preco).toFixed(2)}</p>
                            </div>
                            <div class="flex gap-2">
                                <button class="text-blue-600 font-semibold hover:text-blue-800" data-action="edit">Editar</button>
                                <button class="text-red-600 font-semibold hover:text-red-800" data-action="delete">Apagar</button>
                            </div>
                        `;
                        row.querySelector('[data-action="edit"]').addEventListener('click', () => {
                            editingServiceId = s.id;
                            formTitleService.textContent = 'Editar Serviço';
                            actionServiceButton.textContent = 'Atualizar';
                            cancelEditServiceButton.classList.remove('hidden');
                            serviceNameInput.value = s.nome;
                            servicePriceInput.value = Number(s.preco).toFixed(2);
                            if (categories.includes(category)) serviceCategorySelect.value = category;
                        });
                        row.querySelector('[data-action="delete"]').addEventListener('click', () => deleteService(s.id));
                        list.appendChild(row);
                    });

                    categoryDiv.appendChild(list);
                    servicesListContainer.appendChild(categoryDiv);
                }
            } catch (err) {
                console.error(err);
                servicesListContainer.innerHTML = `<p class="text-red-600">${err.message}</p>`;
            }
        }

        async function deleteService(id) {
            if (!confirm('Tem certeza que deseja apagar este serviço?')) return;
            try {
                const response = await fetch(`${API_URL}/services/${id}`, { method: 'DELETE' });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'Erro ao apagar serviço.');
                await loadAndRenderServices();
                resetServiceForm();
            } catch (err) {
                alert(err.message);
            }
        }

        async function handleServiceFormAction() {
            const payload = {
                name: serviceNameInput.value.trim(),
                category: serviceCategorySelect.value.trim(),
                price: servicePriceInput.value
            };
            if (!payload.name || !payload.category || payload.price === '') {
                alert('Nome, categoria e preço são obrigatórios.');
                return;
            }

            const url = editingServiceId ? `${API_URL}/services/${editingServiceId}` : `${API_URL}/services`;
            const method = editingServiceId ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'Ocorreu um erro.');

                await loadAndRenderServices();
                resetServiceForm();
            } catch (err) {
                alert(err.message);
            }
        }

        // --- Costureiras ---
        async function loadAndRenderSeamstresses() {
            try {
                const response = await fetch(`${API_URL}/seamstresses`);
                const data = await response.json().catch(() => []);
                if (!response.ok) throw new Error(data.error || 'Não foi possível carregar as costureiras.');

                seamstressListContainer.innerHTML = '';
                if (!data || data.length === 0) {
                    seamstressListContainer.innerHTML = '<p class="text-gray-500">Nenhuma costureira registada.</p>';
                    return;
                }

                data.forEach(s => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between bg-gray-50 p-3 rounded-lg border';
                    row.innerHTML = `
                        <p class="font-semibold text-gray-800">${s.name}</p>
                        <div class="flex gap-2">
                            <button class="text-blue-600 font-semibold hover:text-blue-800" data-action="edit">Editar</button>
                            <button class="text-red-600 font-semibold hover:text-red-800" data-action="delete">Apagar</button>
                        </div>
                    `;
                    row.querySelector('[data-action="edit"]').addEventListener('click', () => {
                        editingSeamstressId = s.id;
                        formTitleSeamstress.textContent = 'Editar Costureira';
                        actionSeamstressButton.textContent = 'Atualizar';
                        cancelEditSeamstressButton.classList.remove('hidden');
                        seamstressNameInput.value = s.name;
                    });
                    row.querySelector('[data-action="delete"]').addEventListener('click', () => deleteSeamstress(s.id));
                    seamstressListContainer.appendChild(row);
                });
            } catch (err) {
                console.error(err);
                seamstressListContainer.innerHTML = `<p class="text-red-600">${err.message}</p>`;
            }
        }

        async function deleteSeamstress(id) {
            if (!confirm('Tem certeza que deseja apagar esta costureira?')) return;
            try {
                const response = await fetch(`${API_URL}/seamstresses/${id}`, { method: 'DELETE' });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'Erro ao apagar costureira.');
                await loadAndRenderSeamstresses();
                resetSeamstressForm();
            } catch (err) {
                alert(err.message);
            }
        }

        async function handleSeamstressFormAction() {
            const seamstressData = { name: seamstressNameInput.value.trim() };
            if (!seamstressData.name) {
                alert('O nome da costureira é obrigatório.');
                return;
            }

            const url = editingSeamstressId ? `${API_URL}/seamstresses/${editingSeamstressId}` : `${API_URL}/seamstresses`;
            const method = editingSeamstressId ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(seamstressData)
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'Ocorreu um erro.');

                await loadAndRenderSeamstresses();
                resetSeamstressForm();
            } catch (err) {
                alert(err.message);
            }
        }

        // Eventos botões
        actionServiceButton.addEventListener('click', handleServiceFormAction);
        cancelEditServiceButton.addEventListener('click', resetServiceForm);

        actionSeamstressButton.addEventListener('click', handleSeamstressFormAction);
        cancelEditSeamstressButton.addEventListener('click', resetSeamstressForm);

        // Inicialização
        document.addEventListener('DOMContentLoaded', async () => {
            await loadAndRenderServices();
            await loadAndRenderSeamstresses();
        });
    </script>
</body>
</html>
