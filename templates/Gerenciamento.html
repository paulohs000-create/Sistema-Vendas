<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* pequenos ajustes para ficar parecido com o teu print */
    .card { box-shadow: 0 10px 25px rgba(0,0,0,.08); }
  </style>
</head>
<body class="min-h-screen bg-[#f7f3f1]">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-8">

      <!-- Menu lateral da página (igual ao print 1) -->
      <aside class="bg-white rounded-2xl p-6 card h-fit">
        <h2 class="text-xl font-bold text-gray-800">Menu</h2>
        <div class="mt-4 space-y-2">
          <button id="tab-services" class="w-full text-left px-4 py-3 rounded-xl bg-purple-100 text-purple-800 font-semibold">Gerir Serviços</button>
          <button id="tab-seams" class="w-full text-left px-4 py-3 rounded-xl hover:bg-gray-50 text-gray-700 font-semibold">Gerir Costureiras</button>
          <a href="/logout?next=/login" class="block w-full text-left px-4 py-3 rounded-xl hover:bg-gray-50 text-red-600 font-semibold">Sair</a>
        </div>
        <div class="mt-6 text-xs text-gray-500">
          * Categorias são baseadas no campo <b>category</b> da tabela <b>services</b>.
        </div>
      </aside>

      <!-- Conteúdo -->
      <main class="space-y-8">

        <!-- ===================== TAB: SERVIÇOS ===================== -->
        <section id="panel-services" class="space-y-8">
          <div class="bg-white rounded-2xl p-8 card">
            <h1 class="text-3xl font-extrabold text-gray-800">Adicionar Novo Serviço</h1>

            <div class="mt-6 space-y-4">
              <div>
                <label class="block text-sm font-semibold text-gray-700">Nome do Serviço</label>
                <input id="svc-name" class="mt-1 w-full border rounded-xl px-4 py-3" placeholder="Ex: Bainha" />
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700">Categoria</label>
                <div class="mt-1 grid grid-cols-1 md:grid-cols-[1fr_1fr] gap-3">
                  <select id="svc-category" class="w-full border rounded-xl px-4 py-3">
                    <option value="">Selecione uma categoria</option>
                    <option value="__new__">+ Nova categoria…</option>
                  </select>
                  <input id="svc-category-new" class="w-full border rounded-xl px-4 py-3 hidden" placeholder="Digite o nome da nova categoria" />
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700">Preço (€)</label>
                <input id="svc-price" type="number" step="0.01" class="mt-1 w-full border rounded-xl px-4 py-3" placeholder="0.00" />
              </div>

              <div class="flex justify-end">
                <button id="btn-add-service" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-8 py-3 rounded-full">
                  Adicionar Serviço
                </button>
              </div>

              <div id="svc-msg" class="text-sm"></div>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-8 card">
            <h2 class="text-3xl font-extrabold text-gray-800">Serviços Existentes</h2>
            <div class="mt-2 text-sm text-gray-500">Clique em <b>Editar</b> para alterar nome, preço ou categoria. Categorias agora podem ser <b>renomeadas</b> ou <b>apagadas</b> pelo cabeçalho.</div>

            <div id="services-container" class="mt-6 space-y-8"></div>
          </div>
        </section>

        <!-- ===================== TAB: COSTUREIRAS ===================== -->
        <section id="panel-seams" class="space-y-8 hidden">
          <div class="bg-white rounded-2xl p-8 card">
            <h1 class="text-3xl font-extrabold text-gray-800">Gerir Costureiras</h1>

            <div class="mt-6 grid grid-cols-1 md:grid-cols-[1fr_auto] gap-3">
              <input id="seam-name" class="border rounded-xl px-4 py-3" placeholder="Nome da costureira" />
              <button id="btn-add-seam" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-8 py-3 rounded-full">Adicionar</button>
            </div>
            <div id="seam-msg" class="mt-3 text-sm"></div>

            <div class="mt-6">
              <table class="min-w-full text-sm">
                <thead>
                  <tr class="border-b">
                    <th class="text-left py-2">Nome</th>
                    <th class="text-right py-2">Ações</th>
                  </tr>
                </thead>
                <tbody id="seams-tbody"></tbody>
              </table>
            </div>
          </div>
        </section>

      </main>

    </div>
  </div>

<script>
  // -------------------------
  // Tabs
  // -------------------------
  const tabServicesBtn = document.getElementById('tab-services');
  const tabSeamsBtn = document.getElementById('tab-seams');
  const panelServices = document.getElementById('panel-services');
  const panelSeams = document.getElementById('panel-seams');

  function setTab(tab){
    if(tab === 'services'){
      tabServicesBtn.className = 'w-full text-left px-4 py-3 rounded-xl bg-purple-100 text-purple-800 font-semibold';
      tabSeamsBtn.className = 'w-full text-left px-4 py-3 rounded-xl hover:bg-gray-50 text-gray-700 font-semibold';
      panelServices.classList.remove('hidden');
      panelSeams.classList.add('hidden');
    }else{
      tabSeamsBtn.className = 'w-full text-left px-4 py-3 rounded-xl bg-purple-100 text-purple-800 font-semibold';
      tabServicesBtn.className = 'w-full text-left px-4 py-3 rounded-xl hover:bg-gray-50 text-gray-700 font-semibold';
      panelSeams.classList.remove('hidden');
      panelServices.classList.add('hidden');
    }
  }
  tabServicesBtn.addEventListener('click', ()=>setTab('services'));
  tabSeamsBtn.addEventListener('click', ()=>setTab('seams'));

  // -------------------------
  // Helpers
  // -------------------------
  function eur(v){
    try { return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(Number(v||0)); }
    catch(e){ return (v||0) + ' €'; }
  }

  function showMsg(el, text, ok=true){
    el.textContent = text || '';
    el.className = 'text-sm ' + (ok ? 'text-emerald-700' : 'text-red-600');
  }

  // -------------------------
  // Services: load/render
  // -------------------------
  const servicesContainer = document.getElementById('services-container');
  const svcCategorySelect = document.getElementById('svc-category');
  const svcCategoryNew = document.getElementById('svc-category-new');
  const svcMsg = document.getElementById('svc-msg');

  svcCategorySelect.addEventListener('change', ()=>{
    if(svcCategorySelect.value === '__new__'){
      svcCategoryNew.classList.remove('hidden');
      svcCategoryNew.focus();
    }else{
      svcCategoryNew.classList.add('hidden');
      svcCategoryNew.value = '';
    }
  });

  async function fetchServices(){
    const r = await fetch('/services', { credentials: 'same-origin' });
    if(!r.ok) throw new Error('Falha ao carregar serviços');
    return await r.json();
  }

  function renderCategoryHeader(cat){
    // Botões de categoria: Editar/Apagar
    // "somente para os itens da categoria" = os botões aparecem no cabeçalho da categoria
    const safeCat = cat;
    return `
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-xl font-bold text-gray-800">${safeCat}</div>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn-edit-cat text-sm font-semibold text-blue-600 hover:underline" data-cat="${encodeURIComponent(cat)}">Editar categoria</button>
          <button class="btn-del-cat text-sm font-semibold text-red-600 hover:underline" data-cat="${encodeURIComponent(cat)}">Deletar categoria</button>
        </div>
      </div>
    `;
  }

  function renderServiceRow(svc){
    return `
      <div class="flex items-center justify-between py-3 border-b last:border-b-0">
        <div>
          <div class="font-semibold text-gray-800">${svc.nome}</div>
          <div class="text-gray-500">${eur(svc.preco)}</div>
        </div>
        <div class="flex items-center gap-3">
          <button class="btn-edit-svc text-sm font-semibold text-blue-600 hover:underline" data-id="${svc.id}">Editar</button>
          <button class="btn-del-svc text-sm font-semibold text-red-600 hover:underline" data-id="${svc.id}">×</button>
        </div>
      </div>
    `;
  }

  async function loadAndRenderServices(){
    servicesContainer.innerHTML = '<div class="text-gray-500">Carregando...</div>';
    const data = await fetchServices();

    // popular select de categorias
    const cats = Object.keys(data || {}).sort((a,b)=>a.localeCompare(b));
    const current = svcCategorySelect.value;
    svcCategorySelect.innerHTML = '<option value="">Selecione uma categoria</option>'
      + cats.map(c=>`<option value="${c}">${c}</option>`).join('')
      + '<option value="__new__">+ Nova categoria…</option>';
    if(cats.includes(current)) svcCategorySelect.value = current;

    if(cats.length === 0){
      servicesContainer.innerHTML = '<div class="text-gray-500">Nenhum serviço cadastrado.</div>';
      return;
    }

    servicesContainer.innerHTML = cats.map(cat => {
      const items = (data[cat] || []);
      return `
        <div class="border rounded-2xl p-6">
          ${renderCategoryHeader(cat)}
          <div class="mt-4">
            ${items.map(renderServiceRow).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  // -------------------------
  // Services: add/edit/delete
  // -------------------------
  document.getElementById('btn-add-service').addEventListener('click', async ()=>{
    showMsg(svcMsg, '');
    const name = (document.getElementById('svc-name').value || '').trim();

    let category = (svcCategorySelect.value || '').trim();
    if(category === '__new__'){
      category = (svcCategoryNew.value || '').trim();
    }

    const price = document.getElementById('svc-price').value;

    if(!name || !category || price === ''){
      showMsg(svcMsg, 'Preencha nome, categoria e preço.', false);
      return;
    }

    try{
      const r = await fetch('/services', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, category, price })
      });
      const resp = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(resp.error || 'Erro ao adicionar');

      document.getElementById('svc-name').value = '';
      document.getElementById('svc-price').value = '';
      if(svcCategorySelect.value === '__new__'){
        svcCategorySelect.value = category;
        svcCategoryNew.classList.add('hidden');
        svcCategoryNew.value = '';
      }

      showMsg(svcMsg, 'Serviço adicionado com sucesso!');
      await loadAndRenderServices();
    }catch(e){
      console.error(e);
      showMsg(svcMsg, e.message || 'Erro ao adicionar', false);
    }
  });

  document.addEventListener('click', async (e)=>{
    const editSvc = e.target.closest('.btn-edit-svc');
    const delSvc  = e.target.closest('.btn-del-svc');
    const editCat = e.target.closest('.btn-edit-cat');
    const delCat  = e.target.closest('.btn-del-cat');

    // Editar serviço
    if(editSvc){
      const id = editSvc.getAttribute('data-id');
      // precisamos do estado atual: recarrega e acha o item
      const data = await fetchServices();
      let current = null;
      let currentCat = '';
      for(const cat of Object.keys(data)){
        for(const s of data[cat]){
          if(String(s.id) === String(id)){
            current = s;
            currentCat = cat;
          }
        }
      }
      if(!current) return;

      const newName = prompt('Novo nome do serviço:', current.nome);
      if(newName === null) return;

      const newPrice = prompt('Novo preço (ex: 7.50):', String(current.preco));
      if(newPrice === null) return;

      const newCat = prompt('Nova categoria:', currentCat);
      if(newCat === null) return;

      try{
        const r = await fetch(`/services/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: (newName||'').trim(), price: Number(newPrice), category: (newCat||'').trim() })
        });
        const resp = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(resp.error || 'Erro ao editar serviço');
        await loadAndRenderServices();
      }catch(err){
        alert(err.message || 'Erro ao editar');
      }
      return;
    }

    // Deletar serviço
    if(delSvc){
      const id = delSvc.getAttribute('data-id');
      if(!confirm('Deletar este serviço?')) return;
      try{
        const r = await fetch(`/services/${id}`, { method: 'DELETE' });
        const resp = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(resp.error || 'Erro ao deletar serviço');
        await loadAndRenderServices();
      }catch(err){
        alert(err.message || 'Erro ao deletar');
      }
      return;
    }

    // Editar categoria (apenas no cabeçalho da categoria)
    if(editCat){
      const catEncoded = editCat.getAttribute('data-cat');
      const oldCat = decodeURIComponent(catEncoded);
      const newCat = prompt('Novo nome da categoria:', oldCat);
      if(newCat === null) return;
      const trimmed = (newCat || '').trim();
      if(!trimmed) return alert('Nome inválido.');

      if(!confirm(`Renomear categoria "${oldCat}" para "${trimmed}"?\n\nIsso altera TODOS os serviços desta categoria.`)) return;

      try{
        const r = await fetch(`/categories/${encodeURIComponent(oldCat)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ new_name: trimmed })
        });
        const resp = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(resp.error || 'Erro ao renomear categoria');
        await loadAndRenderServices();
      }catch(err){
        alert(err.message || 'Erro ao renomear');
      }
      return;
    }

    // Deletar categoria
    if(delCat){
      const catEncoded = delCat.getAttribute('data-cat');
      const cat = decodeURIComponent(catEncoded);
      if(!confirm(`Deletar a categoria "${cat}"?\n\nIsso vai APAGAR todos os serviços dentro dela.`)) return;

      try{
        const r = await fetch(`/categories/${encodeURIComponent(cat)}`, { method: 'DELETE' });
        const resp = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(resp.error || 'Erro ao deletar categoria');
        await loadAndRenderServices();
      }catch(err){
        alert(err.message || 'Erro ao deletar categoria');
      }
      return;
    }
  });

  // -------------------------
  // Seamstresses CRUD
  // -------------------------
  const seamsTbody = document.getElementById('seams-tbody');
  const seamMsg = document.getElementById('seam-msg');

  async function loadSeamstresses(){
    seamsTbody.innerHTML = '<tr><td class="py-3 text-gray-500" colspan="2">Carregando...</td></tr>';
    const r = await fetch('/seamstresses', { credentials: 'same-origin' });
    const data = await r.json().catch(()=>[]);
    if(!r.ok){
      seamsTbody.innerHTML = '<tr><td class="py-3 text-red-600" colspan="2">Erro ao carregar costureiras.</td></tr>';
      return;
    }

    if(!data.length){
      seamsTbody.innerHTML = '<tr><td class="py-3 text-gray-500" colspan="2">Nenhuma costureira cadastrada.</td></tr>';
      return;
    }

    seamsTbody.innerHTML = data.map(s => `
      <tr class="border-b last:border-b-0">
        <td class="py-3 font-semibold text-gray-800">${s.name}</td>
        <td class="py-3 text-right">
          <button class="btn-edit-seam text-blue-600 hover:underline font-semibold text-sm" data-id="${s.id}" data-name="${encodeURIComponent(s.name)}">Editar</button>
          <span class="mx-2 text-gray-300">|</span>
          <button class="btn-del-seam text-red-600 hover:underline font-semibold text-sm" data-id="${s.id}" data-name="${encodeURIComponent(s.name)}">Deletar</button>
        </td>
      </tr>
    `).join('');
  }

  document.getElementById('btn-add-seam').addEventListener('click', async ()=>{
    showMsg(seamMsg, '');
    const name = (document.getElementById('seam-name').value || '').trim();
    if(!name) return showMsg(seamMsg, 'Digite o nome.', false);

    try{
      const r = await fetch('/seamstresses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      const resp = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(resp.error || 'Erro ao adicionar');
      document.getElementById('seam-name').value = '';
      showMsg(seamMsg, 'Costureira adicionada!');
      await loadSeamstresses();
    }catch(err){
      showMsg(seamMsg, err.message || 'Erro', false);
    }
  });

  document.addEventListener('click', async (e)=>{
    const edit = e.target.closest('.btn-edit-seam');
    const del  = e.target.closest('.btn-del-seam');
    if(!edit && !del) return;

    const id = (edit || del).getAttribute('data-id');
    const oldName = decodeURIComponent((edit || del).getAttribute('data-name') || '');

    if(edit){
      const newName = prompt('Novo nome da costureira:', oldName);
      if(newName === null) return;
      const trimmed = (newName || '').trim();
      if(!trimmed) return alert('Nome inválido.');

      try{
        const r = await fetch(`/seamstresses/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: trimmed })
        });
        const resp = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(resp.error || 'Erro ao editar');
        await loadSeamstresses();
      }catch(err){
        alert(err.message || 'Erro');
      }
    }

    if(del){
      if(!confirm(`Deletar a costureira "${oldName}"?`)) return;
      try{
        const r = await fetch(`/seamstresses/${id}`, { method: 'DELETE' });
        const resp = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(resp.error || 'Erro ao deletar');
        await loadSeamstresses();
      }catch(err){
        alert(err.message || 'Erro');
      }
    }
  });

  // -------------------------
  // init
  // -------------------------
  (async function init(){
    try{
      await loadAndRenderServices();
    }catch(e){
      servicesContainer.innerHTML = '<div class="text-red-600">Erro ao carregar serviços.</div>';
      console.error(e);
    }

    try{
      await loadSeamstresses();
    }catch(e){
      console.error(e);
    }
  })();
</script>

</body>
</html>
